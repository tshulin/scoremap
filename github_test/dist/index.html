<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grademax</title>
    <script type="module" crossorigin src="/assets/index-EqmuTMWh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-NTK4EIZa.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA fallback: 404.html re-encodes deep links as
         /?/path; this restores the real URL before React Router boots.
         (https://github.com/rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </body>
</html>
