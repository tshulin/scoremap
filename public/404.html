<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grademax</title>
    <!-- GitHub Pages serves this for any unknown path (e.g. a refresh on
         /dashboard). Re-encode the path as a query string and bounce to the
         app root, where index.html restores it before React Router boots.
         pathSegmentsToKeep = 1 keeps the /grademax/ project prefix.
         (https://github.com/rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
