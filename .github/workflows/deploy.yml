# Build the app and publish it to GitHub Pages on every push to main.
#
# One-time repo setup (Settings):
#   - Pages -> Source: "GitHub Actions"
#   - Optional Actions variable VITE_BASE: the path the site is served from.
#     Defaults to /scoremap/ (the github.io project page); set it to / when
#     the site moves to a custom domain.
name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from /<repo>/; a custom domain serves from /.
          VITE_BASE: ${{ vars.VITE_BASE || '/scoremap/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
