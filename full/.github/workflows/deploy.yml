# Build web/ and publish it to GitHub Pages on every push to main.
#
# One-time repo setup (Settings):
#   - Pages -> Source: "GitHub Actions"
#   - (optional) Actions variable VITE_API_BASE pointing at the VPS API,
#     e.g. https://api.example.com/api - until it is set, the build bakes in
#     the placeholder below and login will fail with a clear network error.
name: deploy-web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Project sites are served from /<repo>/.
          VITE_BASE: /grademax/
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://REPLACE-WITH-YOUR-VPS-DOMAIN/api' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
